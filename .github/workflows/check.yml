name: check
# PR と main への取り込みで、型・計算の単体テスト、build、画面のテストを走らせる。
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
# 読むだけ（push・PR への書き込みはしない）
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with: {node-version: "22"}
      - run: npm ci
      - run: npx playwright install --with-deps chromium webkit
      - run: npm run check
      # main への取り込みで通ったら、確かめたその build（dist）を公開用に残す。pages.yml はこれを取り出して公開し、作り直さない
      # （確かめた成果物と公開する成果物を同じにする。同じコミットでテストを2回走らせない。stats2-course #285 の決定 2026-11-19）
      - if: success() && github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@v5
        with:
          name: site-dist
          path: dist/
          retention-days: 3
      # 画面のテストが落ちたら、Playwright の記録（WebKit の trace・error-context）を残す（原因を後から見られるように。stats2-course #239）
      - if: failure()
        uses: actions/upload-artifact@v5
        with:
          name: test-results
          path: test-results/
          retention-days: 7
