name: check
# PR と main への取り込みで、型・計算の単体テスト、build、画面のテストを走らせる。
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
# 読むだけ（push・PR への書き込みはしない）
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: "22"}
      - run: npm ci
      - run: npx playwright install --with-deps chromium webkit
      - run: npm run check
      # 画面のテストが落ちたら、Playwright の記録（WebKit の trace・error-context）を残す（原因を後から見られるように。stats2-course #239）
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: test-results/
          retention-days: 7
