name: check
# PR と main への取り込みで、型・計算の単体テスト、build、画面のテストを走らせる。
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: "22"}
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run check
