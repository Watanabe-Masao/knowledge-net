name: pages
# main に入ったら、テストを通してから GitHub Pages に公開する（Settings → Pages の Source を「GitHub Actions」に）。
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency: {group: pages, cancel-in-progress: true}
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with: {node-version: "22"}
      - run: npm ci
      - run: npx playwright install --with-deps chromium webkit
      - run: npm run check
      # 公開の前のテストが落ちたら、check.yml と同じく Playwright の記録（WebKit の trace・error-context）を残す。
      # 公開を止めた失敗の原因を後から見られるように（2026-11-15 に WebKit の「たどった道」で公開が止まり、記録が残らなかった。stats2-course #285）
      - if: failure()
        uses: actions/upload-artifact@v5
        with:
          name: test-results
          path: test-results/
          retention-days: 7
      - uses: actions/upload-pages-artifact@v5
        with: {path: dist}
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment: {name: github-pages, url: "${{ steps.d.outputs.page_url }}"}
    steps:
      - id: d
        uses: actions/deploy-pages@v5
