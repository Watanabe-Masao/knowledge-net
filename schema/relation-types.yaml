# 関係の種類（kn-schema v2。製本 ⑤ の10種類）。build と画面はこのファイルから種類を読む。
# 関係の意味の判断の正本は stats2-course の製本 ⑤（docs/rules/relations.md）。ここは種類の読み方・たどるか・必ず書く項目。
# v1 の種類（前提・導出・一般化・特殊化・変換・対比・統合・応用・種類・材料）と premise は M7（stats2-course #267。2026-11-10）で外した。
# 矢印は from → to。「読み方」の □ に from、■ に to を入れて文になるように登録する。
# required：その種類で必ず書く項目。
# trace：学ぶ順の候補を求めない教材で、画面が「前提をさかのぼる」でたどるか（学ぶ順を書き出した教材は learning_order だけをたどる）。
# 定義の文では、矢印の起点（from）を A、終点（to）を B と書く。
types_v2:
  定める:
    trace: true
    definition: A は B の基準の定義の直接の構成要素（製本 ⑤）
    reading: □ は ■ の定義に使われる
    required: []
  一種:
    trace: true
    definition: A は B の定義を満たし、性質・目的で区別したもの（製本 ⑤）
    reading: □ は ■ の一種
    required: []
  特別な場合:
    trace: true
    definition: B の自由に選べる部分を固定するだけで A と同じものになる（製本 ⑤。固定の仕方は fix）
    reading: □ は ■ の特別な場合
    required: [fix, fix_text]
  移る:
    trace: false
    definition: A に操作・極限をとると B になる（製本 ⑤。厳密・極限・近似は mode）
    reading: □ を移すと ■
    required: [mode]
  従う:
    trace: false
    definition: 確率変数 A の分布は B（製本 ⑤）
    reading: □ は ■ に従う
    required: [claim]
  推定する:
    trace: false
    definition: 標本から作る A は、母集団の B を推定する（製本 ⑤）
    reading: □ は ■ を推定する
    required: [properties]
  導ける:
    trace: true
    definition: A から B が導ける（製本 ⑤）
    reading: □ から ■ が導ける
    required: [claim]
  同値:
    trace: false
    definition: A と B は互いに導ける（製本 ⑤）
    reading: □ と ■ は同値
    required: [claim]
  根拠:
    trace: false
    definition: 定理 A が、手続き B の根拠になる（製本 ⑤）
    reading: □ は ■ の根拠
    required: [claim]
  比べる:
    trace: false
    definition: 同じ問いに答える A と B が、ある軸で違う（製本 ⑤）
    reading: □ と ■ を比べる
    required: [axis, same, differ]
modes:
  exact: 厳密（等しい）
  approximation: 近似（有限の条件のもとで近い）
  limit: 極限（条件を保って進めると近づく）
