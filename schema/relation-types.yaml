# 関係の種類（kn-schema v1）。どの教材も同じ8種類を使う。build と画面はこのファイルから種類を読む。
# 矢印は from → to。「読み方」の □ に from、■ に to を入れて文になるように登録する。
# required：その種類で必ず書く項目。
# trace：「前提をさかのぼる」で、to から from へたどるか（to を理解するのに from が要る向きか）。
types:
  前提:
    trace: true
    definition: to を理解する・成り立たせるのに、from が先に要る。
    reading: □ は ■ の前提
    required: [premise]   # learning（理解に必要な知識）／mathematical（数学的な成立条件・定義に使う）
    examples:
      - "期待値 → 分散（分散は期待値を使って定義される：mathematical）"
      - "組合せ → 二項分布（確率を数えるのに要る：learning）"
    non_examples:
      - "二項分布 → 正規分布（前提ではなく近似の変換）"
      - "単元の並び順（教える順番は関係ではない）"
  導出:
    trace: true
    definition: from から to が式の変形・計算で導ける。前提が1つのとき。前提が2つ以上なら導出（derivations）の点として書く。
    reading: □ から ■ が導ける
    required: [conditions]
    examples:
      - "分散の定義 → V(X)=E(X²)−{E(X)}²"
    non_examples:
      - "期待値・分散・独立 → 二項分布の期待値と分散（前提が3つなので導出の点）"
  一般化:
    trace: true
    definition: from を広げた（条件を外した・次元を上げた）ものが to。逆向きの「特殊化」はデータに書かず、画面で裏から読む。
    reading: □ を一般化すると ■
    required: []
    examples:
      - "ベルヌーイ分布 → 二項分布（1回を n 回に）"
    non_examples:
      - "二項分布 → ポアソン分布（広げたのではなく極限の変換）"
  特殊化:
    trace: true
    definition: from の特別な場合が to。一般化と同じ関係を逆から書くことになるので、原則は一般化で書く。一般化で書けないときだけ使う。
    reading: □ の特別な場合が ■
    required: []
    examples:
      - "正規分布 → 標準正規分布（μ＝0・σ＝1）"
    non_examples:
      - "一般化と同じ組を両方向に書くこと"
  変換:
    trace: true
    definition: from に操作や極限・近似をほどこすと to になる。厳密か、近似か、極限かを必ず区別する（「近い」と「等しい」を混ぜない）。
    reading: □ を変換すると ■
    required: [mode, conditions]   # mode：exact（厳密）／approximation（有限の条件での近似）／limit（条件を保って進めた極限）
    examples:
      - "正規分布の値 → 標準正規分布（標準化：exact）"
      - "二項分布 → 正規分布（approximation）"
      - "二項分布 → ポアソン分布（np を保って n→∞：limit）"
    non_examples:
      - "似ているだけの2つ（対比で書く）"
  対比:
    trace: false
    definition: 似ていて取り違えやすい2つを、違いがはっきりするように並べる。向きは問わない。
    reading: □ と ■ を比べる
    required: []
    examples:
      - "二項分布 ↔ ポアソン分布（回数の上限、分散と平均の関係）"
      - "排反 ↔ 独立"
    non_examples:
      - "一方が他方の特別な場合（一般化・特殊化で書く）"
  統合:
    trace: true
    definition: from を含むいくつかの概念を組み合わせて、to という枠組みになる（to の側から見て複数の from がある）。
    reading: □ は ■ に組み込まれる
    required: []
    examples:
      - "単回帰 → 重回帰の枠組み"
      - "平方和の分解 → 分散分析"
    non_examples:
      - "式で導けるもの（導出）"
  応用:
    trace: false
    definition: from の考え方・道具を、to の場面や問題に使う。
    reading: □ を ■ に使う
    required: []
    examples:
      - "標準化 → 正規分布の確率を表で読む"
      - "中心極限定理 → 正規分布がよく使われる理由"
    non_examples:
      - "to を理解するのに from が要る（前提で書く）"
modes:
  exact: 厳密（等しい）
  approximation: 近似（有限の条件のもとで近い）
  limit: 極限（条件を保って進めると近づく）
premises:
  learning: 理解に必要な知識
  mathematical: 数学的な成立条件・定義に使う
