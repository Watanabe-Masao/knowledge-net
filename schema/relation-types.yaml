# 関係の種類（kn-schema v1）。どの教材も同じ10種類を使う（種類・材料は改訂36）。build と画面はこのファイルから種類を読む。
# 関係の意味の判断の正本は stats2-course の製本 ⑤（docs/rules/relations.md。2026-11-08）。ここは型 v1 の種類と読み方。v1 の種類への写し方と、移すまで新しく書かない種類は docs/rules/migration.md 2。
# 矢印は from → to。「読み方」の □ に from、■ に to を入れて文になるように登録する。
# required：その種類で必ず書く項目。
# trace：「前提をさかのぼる」で、B から A へたどるか（B を理解するのに A が要る向きか）。前提・導出・一般化・特殊化・統合・種類・材料だけ。
# 定義の文では、矢印の起点（from）を A、終点（to）を B と書く。
types:
  前提:
    trace: true
    definition: B を理解する・成り立たせるのに、A が先に要る。
    reading: □ は ■ の前提
    required: [premise]   # learning（理解に必要な知識）／mathematical（数学的な成立条件・定義に使う）。製本 ⑤ で廃止。mathematical は新しく書かない（材料か成立条件に分ける）。learning は学ぶ順へ移すまで書く
    examples:
      - "確率変数 → ベルヌーイ分布（定義に名前が出ないが、学ぶのに要る：learning）"
    non_examples:
      - "二項分布 → 標準正規分布（前提ではなく極限の変換）"
      - "単元の並び順（教える順番は関係ではない）"
  導出:
    trace: true
    definition: A から B が式の変形・計算で導ける。前提が1つのとき。前提が2つ以上なら導出（derivations）の点として書く。
    reading: □ から ■ が導ける
    required: [conditions]
    examples:
      - "独立 → 無相関（独立なら Cov(X, Y)＝0。製本 ④-13）"
    non_examples:
      - "期待値・分散・独立 → 二項分布の期待値と分散（前提が3つなので導出の点）"
      - "分散の定義 → V(X)=E(X²)−{E(X)}²（1つの概念の中の式。関係にしない：製本 ⑤）"
  一般化:
    trace: true
    definition: A を広げた（条件を外した・次元を上げた）ものが B。逆向きの「特殊化」はデータに書かず、画面で裏から読む。
    reading: □ を一般化すると ■
    required: []
    examples:
      - "ベルヌーイ分布 → 二項分布（n＝1 に固定すると一致する）"
    non_examples:
      - "二項分布 → ポアソン分布（広げたのではなく極限の変換）"
  特殊化:
    trace: true
    definition: A の特別な場合が B。一般化と同じ関係を逆から書くことになるので、原則は一般化で書く。一般化で書けないときだけ使う。
    reading: □ の特別な場合が ■
    required: []
    examples: []
    non_examples:
      - "一般化と同じ組を両方向に書くこと"
      - "新しく書くこと（製本 ⑤ の特別な場合は一般化で書く）"
  変換:
    trace: false   # 変換は学ぶ順ではない（二項分布 → 標準正規分布の極限で、標準正規分布に二項分布が要るわけではない）。学ぶ順に要るものは「前提」で別に書く
    definition: A に操作や極限・近似をほどこすと B になる。厳密か、近似か、極限かを必ず区別する（「近い」と「等しい」を混ぜない）。
    reading: □ を変換すると ■
    required: [mode, conditions]   # mode：exact（厳密）／approximation（有限の条件での近似。極限の定理によらないもの：製本 ⑤）／limit（条件を保って進めた極限）。両端は同じ姿（製本 ⑤）
    examples:
      - "t 分布 → F 分布（2乗すると F(1, ν)：exact）"
      - "二項分布 → 標準正規分布（標準化して n→∞：limit。行き先は標準化した量の分布。行き先の語が教材にあるとき）"
      - "二項分布 → ポアソン分布（np を保って n→∞：limit）"
    non_examples:
      - "似ているだけの2つ（対比で書く）"
  対比:
    trace: false
    definition: 同じ姿の2つを、比べる軸で違いがはっきりするように並べる（載せるかの判断は製本 ⑦ の 4）。向きは問わない。比べる軸（axis：何について違うのか）と、違いの1文（description）を書く
    reading: □ と ■ を比べる
    required: []
    examples:
      - "二項分布 ↔ ポアソン分布（回数の上限、分散と平均の関係）"
      - "排反 ↔ 独立"
    non_examples:
      - "比べる軸が、ほかの関係の条件で言い尽くせる組（一般化・種類で書く。製本 ⑤）"
  統合:
    trace: true
    definition: A を含むいくつかの概念を組み合わせて、B という枠組みになる（B の側から見て複数の A がある）。
    reading: □ は ■ に組み込まれる
    required: []   # 製本 ⑤ の種類にない。新しく書かない
    examples:
      - "単回帰 → 重回帰の枠組み"
      - "平方和の分解 → 分散分析"
    non_examples:
      - "式で導けるもの（導出）"
  応用:
    trace: false
    definition: A の考え方・道具を、B の場面や問題に使う。
    reading: □ を ■ に使う
    required: []   # 製本 ⑤ で廃止（使い道は問いの本文で見せる：製本 ⑦）。新しく書かない
    examples:
      - "標準化 → 正規分布の確率を表で読む"
      - "中心極限定理 → 正規分布がよく使われる理由"
    non_examples:
      - "to を理解するのに from が要る（前提で書く）"
  種類:
    trace: true   # 学ぶ順の見方（今の経路）は、M4 で作り直すまで前提といっしょにたどる（stats2-course #232）
    definition: B の定義をすべて満たし、そのうえで B の中の1つとして区別できるのが A。一種か特別な場合かは製本 ⑤ の判定の順で決める。B が教材にないときは書かず、上の語でも代わりにしない（製本 ⑤ の 8 の規則1）。1つの語の親は多くて1つ
    reading: □ は ■ の一種
    required: []
    examples:
      - "事後確率 → 条件付き確率（原因についての条件付き確率）"
      - "推定量 → 統計量"
    non_examples:
      - "ベルヌーイ分布 → 二項分布（1回を n 回に広げた：一般化）"
      - "標準正規分布 → 正規分布（固定の仕方 μ＝0・σ＝1 で言えるので一般化。製本 ⑤ の判定の順）"
      - "二項分布 → 確率分布（間の「離散分布」が教材にないので書かない）"
      - "第1種の過誤 → 検出力（同じまとまりにいるだけ）"
  材料:
    trace: true   # 学ぶ順の見方（今の経路）は、M4 で作り直すまで前提といっしょにたどる（stats2-course #232）
    definition: A がなければ B を作れない、B の定義（定義1文か、その語を定める式）の構成要素。「B は何でできているか」に答える。定義に名前で出ることは必要条件で、十分条件ではない（製本 ⑤ の定める）。直接の材料だけを書く
    reading: □ は ■ の定義に使われる   # 画面の呼び名は「定義に使う概念」（向きは使われる概念 → それを使う概念。stats2-course #249 ④）
    required: []
    examples:
      - "偏差 → データの分散"
      - "組合せ → 二項分布（確率関数 ₙCₖ pᵏ(1−p)ⁿ⁻ᵏ）"
      - "確率密度関数 → 正規分布"
    non_examples:
      - "独立 → 幾何分布（「独立な試行」は成り立つ条件。conditions に書く）"
      - "確率変数 → ベルヌーイ分布（定義に名前が出ない：前提 learning）"
      - "回帰式 → 最小二乗法（操作の対象。材料ではない）"
      - "期待値 → 分散の近道の式 E(X²)−{E(X)}²（計算の近道は概念の中身。関係にしない：製本 ⑤）"
modes:
  exact: 厳密（等しい）
  approximation: 近似（有限の条件のもとで近い）
  limit: 極限（条件を保って進めると近づく）
premises:
  learning: 理解に必要な知識   # 画面の呼び名は「前提知識」（#249）
  mathematical: 数学的な成立条件・定義に使う
